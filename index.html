<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUXERIS | Corporate Gifting Solutions</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#fffdf7]">
    <nav class="p-6 border-b border-yellow-100 flex justify-between items-center bg-white">
        <h1 class="text-2xl font-bold text-yellow-700">LUXERIS</h1>
        <div class="space-x-4">
            <a href="#products">Products</a>
            <a href="#contact" class="bg-yellow-500 px-4 py-2 rounded-full">Contact</a>
        </div>
    </nav>

    <div id="products" class="grid grid-cols-2 md:grid-cols-3 gap-4 p-6">
        <img src="giftset.jpeg" class="w-full h-48 object-cover rounded-lg">
        <img src="keychain.jpg" class="w-full h-48 object-cover rounded-lg">
        <img src="umbrella.jpg" class="w-full h-48 object-cover rounded-lg">
        <img src="mugs.jpg" class="w-full h-48 object-cover rounded-lg">
        <img src="tshirt.jpg" class="w-full h-48 object-cover rounded-lg">
        <img src="clockstand.jpg" class="w-full h-48 object-cover rounded-lg">
    </div>

    <div id="contact" class="p-6">
        <h2 class="text-xl font-bold mb-4">Request a Quote</h2>
        <input type="text" id="name" placeholder="Name" class="border p-2 w-full mb-2">
        <textarea id="msg" placeholder="Requirements" class="border p-2 w-full mb-2"></textarea>
        <button onclick="window.location.href='https://wa.me/919819983123?text=' + document.getElementById('msg').value" class="bg-green-500 text-white p-2 w-full">WhatsApp Us</button>
    </div>
</body>
</html>
