name: One-time orphan page fix
on:
  push:
    paths:
      - '.github/workflows/fix-orphan-page.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add internal link and remove temporary workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('corporate-gift-sets.html')
          s = p.read_text()
          old = '<a href="/corporate-keychains.html" class="btn btn-line" style="margin:6px 8px 0 0;">Corporate Keychains</a>'
          new = old + '\n        <a href="/executive-corporate-gifts-clients-business-partners.html" class="btn btn-line" style="margin:6px 8px 0 0;">Executive Corporate Gifts for Clients &amp; Business Partners</a>'
          assert old in s
          assert 'executive-corporate-gifts-clients-business-partners.html' not in s
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add corporate-gift-sets.html
          git rm .github/workflows/fix-orphan-page.yml
          git commit -m "Add internal link to executive corporate gifts"
          git push
